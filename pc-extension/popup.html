<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui; width: 320px; padding: 14px; color: #202124; }
    h2 { margin: 0 0 10px; }
    textarea { width: 100%; min-height: 150px; box-sizing: border-box; font: 12px monospace; }
    button { width: 100%; padding: 10px; margin-top: 8px; cursor: pointer; }
    .hint { color: #5f6368; font-size: 12px; line-height: 1.4; }
    #status { margin-top: 8px; }
  </style>
</head>
<body>
  <h2>FormPilot</h2>
  <p class="hint">Enter profile answers as JSON. Match keys to question labels or distinctive words in the question.</p>
  <textarea id="profile" spellcheck="false" placeholder='{
  "Full name": "Aryan",
  "Roll number": "13",
  "Email": "you@example.com",
  "Department": "Medicine"
}'></textarea>
  <button id="save">Save profile</button>
  <button id="fill">Fill current Google Form</button>
  <div id="status" class="hint"></div>
  <script src="popup.js"></script>
</body>
</html>
